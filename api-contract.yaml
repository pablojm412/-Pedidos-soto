openapi: 3.0.3
info:
  title: API Pedidos - Nombre del Pueblo
  description: >
    Contrato de API para la app de pedidos estilo PedidosYa.
    Este documento es un BORRADOR de trabajo para discutir entre los 3 programadores
    antes de empezar a codear. Cualquier cambio en un endpoint o estructura de datos
    debe reflejarse acá primero, y avisarse a los otros dos.

    Autenticación: /pedidos y /repartidores exigen el header
    "Authorization: Bearer <access_token>" (el token se obtiene en /auth/login).
    Sin token responden 401; con un rol sin permiso responden 403.
  version: 0.1.0

servers:
  - url: https://api.pedidos-pueblo.com/v1
    description: Producción (a definir dominio real)
  - url: http://localhost:3000/v1
    description: Desarrollo local

tags:
  - name: Auth
  - name: Usuarios
  - name: Comercios
  - name: Productos
  - name: Pedidos
  - name: Repartidores
  - name: Pagos

paths:
  # ============ AUTH ============
  /auth/registro:
    post:
      tags: [Auth]
      summary: Registro público de un nuevo usuario (siempre con rol cliente)
      description: >
        El registro público siempre crea usuarios con rol "cliente". Si el body trae un campo
        "rol", el servidor lo ignora. Los roles comercio, repartidor y admin se asignan por
        fuera de este endpoint (por SQL o desde un futuro panel de admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, nombre]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
                nombre: { type: string }
                telefono: { type: string }
      responses:
        "201":
          description: Usuario creado (la respuesta trae un mensaje y el usuario sin la contraseña)
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje: { type: string }
                  usuario: { $ref: "#/components/schemas/Usuario" }
        "400": { description: Datos inválidos o correo ya registrado }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login de usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Login correcto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401": { description: Credenciales inválidas }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renovar access token usando el refresh token
      description: Previsto, todavía no implementado en el backend.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Nuevo access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }

  # ============ COMERCIOS ============
  /comercios:
    get:
      tags: [Comercios]
      summary: Listar comercios (con filtro opcional por categoría / búsqueda)
      parameters:
        - name: categoria
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: abierto
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Lista de comercios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Comercio" }
    post:
      tags: [Comercios]
      summary: Crear comercio (rol admin o comercio)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComercioInput" }
      responses:
        "201": { description: Comercio creado }
        "403": { description: No autorizado }

  /comercios/{comercioId}:
    get:
      tags: [Comercios]
      summary: Detalle de un comercio
      parameters:
        - name: comercioId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Detalle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comercio" }
        "404": { description: No encontrado }
    patch:
      tags: [Comercios]
      summary: Actualizar datos del comercio (horario, estado abierto/cerrado, etc)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: comercioId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComercioInput" }
      responses:
        "200": { description: Actualizado }
        "403": { description: No autorizado }

  /comercios/{comercioId}/productos:
    get:
      tags: [Productos]
      summary: Listar productos de un comercio
      parameters:
        - name: comercioId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Lista de productos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Producto" }
    post:
      tags: [Productos]
      summary: Crear producto en el comercio
      security: [{ bearerAuth: [] }]
      parameters:
        - name: comercioId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductoInput" }
      responses:
        "201": { description: Producto creado }

  /productos/{productoId}:
    patch:
      tags: [Productos]
      summary: Actualizar producto (precio, stock, disponibilidad)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: productoId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductoInput" }
      responses:
        "200": { description: Actualizado }
    delete:
      tags: [Productos]
      summary: Eliminar (o dar de baja) un producto
      security: [{ bearerAuth: [] }]
      parameters:
        - name: productoId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Eliminado }

  # ============ PEDIDOS ============
  /pedidos:
    post:
      tags: [Pedidos]
      summary: Crear un nuevo pedido (cliente)
      description: >
        Los importes los calcula el servidor: subtotal, costo_envio y total salen de los precios
        de los productos en la base y del costo_envio_base del comercio. Si el body trae
        subtotal, total, costo_envio o precio_unitario, se ignoran. El cliente sale del token
        (no del body) y el estado inicial siempre es "pendiente".

        Validaciones: el comercio existe y está abierto; los productos existen, están
        disponibles y son de ese comercio; las cantidades son enteros entre 1 y 50 (máximo 50
        productos distintos); la dirección tiene entre 3 y 120 caracteres. El pedido y sus
        items se guardan en una transacción.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoInput" }
      responses:
        "201":
          description: Pedido creado en estado pendiente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pedido" }
                "400": { description: "Datos inválidos, comercio cerrado, producto no disponible o que no pertenece al comercio" }
        "401": { description: Falta el token o es inválido }
        "404": { description: El comercio no existe }
    get:
      tags: [Pedidos]
      summary: Listar pedidos (el resultado depende del rol del usuario del token)
      description: >
        Cada pedido incluye cliente, comercio, repartidor e items (cada item trae su producto).
        Los pedidos creados antes de guardar los items en cascada pueden tener items vacío.

        Qué ve cada rol: cliente, solo sus pedidos; comercio, los de su local; repartidor,
        los pedidos en estado aceptado y en_camino; admin, todos (puede filtrar por
        comercio_id y cliente_id). Para los demás roles los filtros no amplían lo que se ve.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: comercio_id
          in: query
          description: Solo lo aplica el rol admin
          schema: { type: integer }
        - name: cliente_id
          in: query
          description: Pedidos de ese cliente (lo usa "Mis Pedidos"). Un usuario solo puede pedir los suyos; el admin puede pedir los de cualquiera
          schema: { type: integer }
        - name: estado
          in: query
          description: Previsto pero todavía no implementado en el backend
          schema: { $ref: "#/components/schemas/EstadoPedido" }
      responses:
        "200":
          description: Lista de pedidos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pedido" }
        "401": { description: Falta el token o es inválido }
        "403": { description: Comercio sin local asignado o rol sin permiso }

  /pedidos/{pedidoId}:
    get:
      tags: [Pedidos]
      summary: Detalle de un pedido
      description: Lo puede ver el cliente dueño del pedido, el comercio del pedido, un repartidor o un admin.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: pedidoId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Detalle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pedido" }
        "401": { description: Falta el token o es inválido }
        "403": { description: El pedido no es del usuario }
        "404": { description: No encontrado }

  /pedidos/{pedidoId}/estado:
    patch:
      tags: [Pedidos]
      summary: Cambiar estado del pedido (comercio confirma/prepara, repartidor entrega, etc)
      description: >
        Estados que acepta hoy el backend: pendiente, aceptado, en_camino, entregado, cancelado.
        Un estado fuera de esa lista devuelve 400 y un pedido inexistente devuelve 404.
        No valida las transiciones entre estados.

        Quién puede: el comercio (solo de sus pedidos), el repartidor (solo para pasar a
        entregado) y el admin. El cliente no puede cambiar estados.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: pedidoId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { $ref: "#/components/schemas/EstadoPedido" }
      responses:
        "200": { description: Estado actualizado }
        "400": { description: Estado inválido }
        "401": { description: Falta el token o es inválido }
        "403": { description: Rol sin permiso o pedido de otro comercio }
        "404": { description: No encontrado }

  /pedidos/{pedidoId}/asignar-repartidor:
    patch:
      tags: [Pedidos]
      summary: Asignar un repartidor a un pedido
      description: Previsto, todavía no implementado en el backend.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: pedidoId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repartidorId]
              properties:
                repartidorId: { type: string }
      responses:
        "200": { description: Repartidor asignado }

  # ============ REPARTIDORES ============
  /repartidores/{repartidorId}/ubicacion:
    patch:
      tags: [Repartidores]
      summary: Actualizar ubicación en tiempo real del repartidor
      description: Solo el propio repartidor (el id de la URL debe ser el del token) o un admin.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: repartidorId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number, format: float }
                lng: { type: number, format: float }
      responses:
        "200": { description: Ubicación actualizada }
        "401": { description: Falta el token o es inválido }
        "403": { description: No es el propio repartidor }

  # ============ PAGOS ============
  /pagos/crear-preferencia:
    post:
      tags: [Pagos]
      summary: Crear preferencia de pago en Mercado Pago para un pedido
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pedidoId]
              properties:
                pedidoId: { type: string }
      responses:
        "200":
          description: URL de checkout de Mercado Pago
          content:
            application/json:
              schema:
                type: object
                properties:
                  initPoint: { type: string, format: uri }

  /pagos/webhook-mercadopago:
    post:
      tags: [Pagos]
      summary: Webhook que llama Mercado Pago para confirmar/rechazar un pago
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Payload que envía Mercado Pago (ver su documentación oficial)
      responses:
        "200": { description: Recibido }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        usuario: { $ref: "#/components/schemas/Usuario" }

    Usuario:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        nombre: { type: string }
        telefono: { type: string }
        rol: { type: string, enum: [cliente, comercio, repartidor, admin] }

    Comercio:
      type: object
      properties:
        id: { type: string }
        nombre: { type: string }
        categoria: { type: string }
        direccion: { type: string }
        lat: { type: number }
        lng: { type: number }
        abierto: { type: boolean }
        horario: { type: string }
        logoUrl: { type: string }
        costoEnvioBase: { type: number }

    ComercioInput:
      type: object
      required: [nombre, categoria, direccion, lat, lng]
      properties:
        nombre: { type: string }
        categoria: { type: string }
        direccion: { type: string }
        lat: { type: number }
        lng: { type: number }
        abierto: { type: boolean }
        horario: { type: string }
        costoEnvioBase: { type: number }

    Producto:
      type: object
      properties:
        id: { type: string }
        comercioId: { type: string }
        nombre: { type: string }
        descripcion: { type: string }
        precio: { type: number }
        disponible: { type: boolean }
        stock: { type: integer, nullable: true }
        imagenUrl: { type: string }
        categoria: { type: string }

    ProductoInput:
      type: object
      required: [nombre, precio]
      properties:
        nombre: { type: string }
        descripcion: { type: string }
        precio: { type: number }
        disponible: { type: boolean }
        stock: { type: integer, nullable: true }
        imagenUrl: { type: string }
        categoria: { type: string }

    EstadoPedido:
      type: string
      description: >
        Contrato original. El backend hoy usa solo: pendiente, aceptado, en_camino,
        entregado, cancelado (ver PATCH /pedidos/{pedidoId}/estado).
      enum:
        - pendiente_pago
        - confirmado
        - en_preparacion
        - listo_para_retirar
        - en_camino
        - entregado
        - cancelado

    ItemPedido:
      type: object
      required: [productoId, cantidad]
      properties:
        productoId: { type: string }
        nombreProducto: { type: string }
        cantidad: { type: integer }
        precioUnitario: { type: number }
        notas: { type: string }

    PedidoInput:
      type: object
      description: >
        Body real de POST /pedidos (nombres en snake_case, como los usa el backend).
        Cualquier otro campo, en especial los importes, se ignora.
      required: [comercio_id, items, direccion_entrega]
      properties:
        comercio_id: { type: integer }
        direccion_entrega: { type: string, minLength: 3, maxLength: 120 }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [producto_id, cantidad]
            properties:
              producto_id: { type: integer }
              cantidad: { type: integer, minimum: 1, maximum: 50 }

    Pedido:
      type: object
      properties:
        id: { type: string }
        clienteId: { type: string }
        comercioId: { type: string }
        repartidorId: { type: string, nullable: true }
        items:
          type: array
          items: { $ref: "#/components/schemas/ItemPedido" }
        subtotal: { type: number }
        costoEnvio: { type: number }
        total: { type: number }
        estado: { $ref: "#/components/schemas/EstadoPedido" }
        direccionEntrega: { type: string }
        latEntrega: { type: number }
        lngEntrega: { type: number }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }